name: CI

# Lint, type-check, and build the app. Forks of this template inherit this
# workflow as-is — the only per-repo setup is granting the org NPM_TOKEN secret
# access to the new repo (or linking the @teamzira/alloy package to it), so the
# install step can pull @teamzira/* from GitHub Packages. No code changes and no
# new token per fork.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          # Injects auth for the @teamzira scope from NODE_AUTH_TOKEN at install
          # time; pairs with the committed scope-only .npmrc.
          registry-url: https://npm.pkg.github.com
          scope: '@teamzira'

      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          # read:packages token (org or repo secret named NODE_AUTH_TOKEN —
          # same name as the .npmrc var and the Vercel env var). Falls back to
          # the built-in GITHUB_TOKEN if you link the package to the repo
          # instead of using a PAT (see packages/alloy/README.md "CI auth").
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Lint
        run: yarn lint

      - name: Type-check
        run: yarn typecheck

      - name: Build
        run: yarn build
